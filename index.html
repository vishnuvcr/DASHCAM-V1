<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <meta name="description" content="DASHCAM-V1 browser-only ADAS HUD">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/app.css">
  <title>DASHCAM-V1</title>
</head>
<body>
  <main class="app" aria-label="DASHCAM-V1">
    <header class="topbar">
      <div>
        <div class="eyebrow">DASHCAM-V1</div>
        <h1>Browser ADAS HUD</h1>
      </div>
      <div id="runtime-status" class="status-pill" data-state="idle">READY</div>
    </header>

    <section class="stage">
      <video id="camera" playsinline muted autoplay></video>
      <canvas id="overlay" aria-label="ADAS overlay"></canvas>

      <div class="hud-grid" aria-hidden="true">
        <div class="hud-corner top-left"></div>
        <div class="hud-corner top-right"></div>
        <div class="hud-corner bottom-left"></div>
        <div class="hud-corner bottom-right"></div>
      </div>

      <div id="warning-fcw" class="warning warning-fcw" role="status" aria-live="assertive">FCW</div>
      <div id="warning-ldw" class="warning warning-ldw" role="status" aria-live="polite">LDW</div>

      <div class="telemetry">
        <span>FPS <strong id="fps">0</strong></span>
        <span>MODE <strong id="mode">STANDBY</strong></span>
        <span>EVENTS <strong id="event-count">0</strong></span>
      </div>
    </section>

    <section class="controls">
      <button id="start-camera" class="primary">Start Camera</button>
      <button id="stop-camera">Stop Camera</button>
      <label class="file-button">
        Load Video
        <input id="video-file" type="file" accept="video/*" hidden>
      </label>
      <label class="file-button">
        Load Model
        <input id="model-file" type="file" accept=".onnx,application/octet-stream" hidden>
      </label>
      <button id="forget-model">Remove Stored Model</button>
      <button id="test-fcw">Simulate FCW</button>
      <button id="test-ldw">Simulate LDW</button>
      <button id="clear-warnings">Clear</button>
    </section>

    <p id="message" class="message">Automatic LDW runs from the camera/replay. Automatic FCW requires a compatible ONNX detector model. Load Model can be used for fully local model testing.</p>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
